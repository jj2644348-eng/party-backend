<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PB Live World</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #070914; color: #fff; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    .mobile-frame { width: 100%; max-width: 440px; height: 100%; background: #0c1022; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    /* Login Screen */
    #authScreen { position: absolute; inset: 0; background: radial-gradient(circle at top, #1f1035, #070914); z-index: 999; display: flex; flex-direction: column; justify-content: center; padding: 28px; }
    .brand-title { font-size: 28px; font-weight: 900; background: linear-gradient(135deg, #00f0ff, #ff0055); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1px; }
    .custom-input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 14px; color: #fff; font-size: 14px; margin-bottom: 14px; outline: none; transition: 0.3s; }
    .custom-input:focus { border-color: #00f0ff; background: rgba(0,240,255,0.05); }
    .btn-gradient { background: linear-gradient(135deg, #ff0055, #ff5e00); color: #fff; font-weight: bold; border: none; padding: 14px; border-radius: 14px; cursor: pointer; font-size: 15px; box-shadow: 0 4px 15px rgba(255,0,85,0.4); }

    /* Top Bar */
    .top-header { height: 56px; padding: 0 14px; display: flex; justify-content: space-between; align-items: center; background: #0e142a; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .brand-logo { font-weight: 900; font-size: 16px; color: #00f0ff; display: flex; align-items: center; gap: 6px; }
    .btn-create-room { background: linear-gradient(90deg, #00f0ff, #0072ff); color: #000; font-weight: 800; font-size: 11px; padding: 7px 12px; border-radius: 20px; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 10px rgba(0,240,255,0.3); }

    /* Tabs Content */
    .tab-content { flex: 1; overflow-y: auto; display: none; flex-direction: column; padding: 12px 12px 70px; }
    .tab-content.active { display: flex; }

    /* Room Cards */
    .room-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .room-card { background: #131936; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); position: relative; cursor: pointer; }
    .room-card img { width: 100%; height: 125px; object-fit: cover; }
    .room-tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); font-size: 9px; font-weight: bold; padding: 3px 8px; border-radius: 10px; color: #00f0ff; }
    .room-info { padding: 8px 10px; }
    .room-name { font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .room-host { font-size: 10px; color: #7f91c7; margin-top: 2px; }

    /* Voice Room Screen */
    .voice-room { position: absolute; inset: 0; background: radial-gradient(circle at top, #23123d, #070914); z-index: 300; display: none; flex-direction: column; }
    .vr-header { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; background: rgba(14,20,42,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .stage-12 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px 12px; }
    .mic-seat { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .seat-circle { width: 50px; height: 50px; border-radius: 50%; background: #151c3d; border: 2px dashed rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; font-size: 13px; font-weight: bold; color: #7f91c7; transition: 0.3s; position: relative; }
    .seat-circle.active { border: 2px solid #00f0ff; background: #1e2957; color: #fff; box-shadow: 0 0 15px rgba(0,240,255,0.6); }
    .seat-circle.muted { border-color: #ff0055; }
    .seat-name { font-size: 9px; color: #a1b0db; margin-top: 4px; max-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Bottom Nav */
    .bottom-nav { height: 60px; background: #0c1022; border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-around; align-items: center; position: absolute; bottom: 0; left: 0; width: 100%; z-index: 200; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #5f70a3; cursor: pointer; gap: 3px; }
    .nav-btn.active { color: #00f0ff; font-weight: bold; }

    /* Floating Gift Box & Modals */
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 800; display: none; justify-content: center; align-items: flex-end; }
    .modal-sheet { width: 100%; max-width: 440px; background: #101633; border-top: 2px solid #00f0ff; border-radius: 20px 20px 0 0; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .gift-items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 240px; overflow-y: auto; }
    .gift-card { background: #171f45; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; }
    .gift-card.selected { border-color: gold; background: #28214f; box-shadow: 0 0 12px rgba(255,215,0,0.4); }
  </style>
</head>
<body>

<div class="mobile-frame">

  <!-- Login Modal -->
  <div id="authScreen">
    <div class="brand-title">⚡ PB LIVE STUDIO</div>
    <input type="text" id="loginName" class="custom-input" placeholder="Your Name" value="☆ Lucky Ak47 🖥️☆">
    <input type="email" id="loginEmail" class="custom-input" placeholder="Gmail Address" value="lp5006352@gmail.com">
    <button class="btn-gradient" onclick="handleAuth()">Enter VIP Lounge 🚀</button>
  </div>

  <!-- Header -->
  <div class="top-header">
    <div class="brand-logo"><i class="fa-solid fa-bolt"></i> PB LIVE</div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="btn-create-room" onclick="showCreateModal()"><i class="fa-solid fa-plus"></i> Create</button>
      <div style="background:gold; color:#000; font-weight:bold; font-size:11px; padding:3px 8px; border-radius:12px;" id="headerCoins">0 C</div>
    </div>
  </div>

  <!-- Live Lobby Tab -->
  <div class="tab-content active" id="tabLobby">
    <div class="room-grid" id="roomsDisplay"></div>
  </div>

  <!-- Me Profile Tab -->
  <div class="tab-content" id="tabProfile">
    <div style="text-align:center; padding: 20px 0;">
      <div style="width:70px; height:70px; border-radius:50%; border:2px solid #00f0ff; margin:0 auto 10px; overflow:hidden;">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <h3 id="profileName">User</h3>
      <p id="profileId" style="color:#00f0ff; font-size:12px; margin-top:2px;"></p>
      <div style="background:#131936; border:1px solid #232d5e; border-radius:16px; padding:16px; margin:20px 0;">
        <span style="font-size:11px; color:#8394ca;">VIP Coin Balance</span>
        <h2 style="color:gold; font-size:24px; margin-top:4px;" id="profileCoins">0 C</h2>
      </div>
      <button class="btn-gradient" style="width:100%; background:#1c244d;" onclick="logout()">Logout Account</button>
    </div>
  </div>

  <!-- Voice Room -->
  <div class="voice-room" id="voiceRoom">
    <div class="vr-header">
      <span id="vrTitle" style="color:#00f0ff; font-weight:bold; font-size:12px;">Room</span>
      <div style="display:flex; gap:8px;">
        <button id="btnToggleMic" style="background:#1e2957; border:1px solid #00f0ff; color:#fff; padding:4px 10px; border-radius:12px; font-size:10px; display:none;" onclick="toggleSelfMic()">🎙️ Mic On</button>
        <button style="background:#ff0055; border:none; color:#fff; padding:4px 12px; border-radius:12px; font-size:10px; font-weight:bold;" onclick="exitVoiceRoom()">Leave</button>
      </div>
    </div>
    <div class="stage-12" id="seatsStage"></div>
    <div style="flex:1; padding:10px; overflow-y:auto; font-size:11px;" id="chatDisplay"></div>
    <div style="height:50px; background:#0e142a; display:flex; align-items:center; padding:0 10px; gap:8px;">
      <button style="background:linear-gradient(135deg,#ff0055,gold); border:none; border-radius:50%; width:36px; height:36px; font-size:18px; cursor:pointer;" onclick="showGiftModal()">🎁</button>
      <input type="text" id="chatInput" style="flex:1; background:#161d3b; border:1px solid #283463; border-radius:20px; padding:7px 12px; color:#fff; font-size:11px; outline:none;" placeholder="Say something...">
      <button class="btn-create-room" onclick="sendChat()">Send</button>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div class="modal-overlay" id="createRoomModal">
    <div class="modal-sheet">
      <h4 style="color:#00f0ff; text-align:center;">✨ Launch New Voice Room</h4>
      <input type="text" id="newRoomTitle" class="custom-input" placeholder="Room Title">
      <select id="newRoomTag" class="custom-input">
        <option value="Rap Battle">🔥 Rap Battle</option>
        <option value="Singing">🎤 Music & Singing</option>
        <option value="VIP Lounge">👑 VIP Elite</option>
      </select>
      <button class="btn-gradient" onclick="submitNewRoom()">Go Live Now 🚀</button>
      <button style="background:transparent; border:none; color:#888; font-size:12px; padding:6px;" onclick="hideModals()">Cancel</button>
    </div>
  </div>

  <!-- Gift Modal -->
  <div class="modal-overlay" id="giftBoxModal">
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="color:gold; font-weight:bold; font-size:12px;">🎁 VIP Gifts</span>
        <select id="giftTargetSeat" class="custom-input" style="padding:4px 8px; font-size:11px; margin:0;">
          <option value="all">🌟 Blast All Mics (12x)</option>
        </select>
      </div>
      <div class="gift-items-grid" id="giftItemsDisplay"></div>
      <button class="btn-gradient" onclick="submitSendGift()">Send Gift 🚀</button>
      <button style="background:transparent; border:none; color:#888; font-size:12px; padding:4px;" onclick="hideModals()">Close</button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-btn active" onclick="switchTab('tabLobby', this)"><i class="fa-solid fa-house" style="font-size:16px;"></i><span>Party</span></div>
    <div class="nav-btn" onclick="switchTab('tabProfile', this)"><i class="fa-solid fa-user" style="font-size:16px;"></i><span>Profile</span></div>
  </div>

</div>

<script>
  const socket = io();
  let user = null, currentRoomId = null, stageSeats = Array(12).fill(null), giftList = [], activeGift = null;

  let saved = localStorage.getItem('pb_live_user');
  if (saved) { user = JSON.parse(saved); document.getElementById('authScreen').style.display = 'none'; syncUserDisplay(); }

  fetch('/api/rooms').then(r => r.json()).then(renderRooms);
  fetch('/api/gifts').then(r => r.json()).then(g => { giftList = g; renderGiftList(); });

  function renderRooms(rms) {
    document.getElementById('roomsDisplay').innerHTML = rms.map(r => `
      <div class="room-card" onclick="enterRoom('${r.id}', '${r.name}')">
        <span class="room-tag">${r.tag}</span>
        <img src="${r.cover}">
        <div class="room-info">
          <div class="room-name">${r.name}</div>
          <div class="room-host">👑 ${r.host}</div>
        </div>
      </div>
    `).join('');
  }

  function renderGiftList() {
    document.getElementById('giftItemsDisplay').innerHTML = giftList.map(g => `
      <div class="gift-card" id="gift_${g.id}" onclick="selectGift('${g.id}')">
        <div style="font-size:24px;">${g.icon}</div>
        <div style="font-size:10px; font-weight:bold; margin-top:2px;">${g.name}</div>
        <div style="font-size:9px; color:gold;">${g.price.toLocaleString()} C</div>
      </div>
    `).join('');
  }

  function selectGift(id) {
    activeGift = giftList.find(x => x.id === id);
    document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
    document.getElementById('gift_' + id).classList.add('selected');
  }

  function handleAuth() {
    let email = document.getElementById('loginEmail').value;
    let username = document.getElementById('loginName').value;
    fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, username }) })
      .then(r => r.json()).then(d => {
        if (d.success) {
          user = d.user;
          localStorage.setItem('pb_live_user', JSON.stringify(user));
          document.getElementById('authScreen').style.display = 'none';
          syncUserDisplay();
        }
      });
  }

  function syncUserDisplay() {
    document.getElementById('headerCoins').innerText = (user.coins || 0).toLocaleString() + ' C';
    document.getElementById('profileCoins').innerText = (user.coins || 0).toLocaleString() + ' C';
    document.getElementById('profileName').innerText = user.username;
    document.getElementById('profileId').innerText = 'PB ID: ' + user.pbId;
  }

  function switchTab(tId, el) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
    document.getElementById(tId).classList.add('active');
  }

  function showCreateModal() { document.getElementById('createRoomModal').style.display = 'flex'; }
  function showGiftModal() {
    let sel = document.getElementById('giftTargetSeat');
    sel.innerHTML = '<option value="all">🌟 Blast All Mics (12x)</option>';
    stageSeats.forEach((s, idx) => {
      if (s) sel.innerHTML += `<option value="${idx}">${s.name} (Mic ${idx+1})</option>`;
    });
    document.getElementById('giftBoxModal').style.display = 'flex';
  }
  function hideModals() {
    document.getElementById('createRoomModal').style.display = 'none';
    document.getElementById('giftBoxModal').style.display = 'none';
  }

  function submitNewRoom() {
    let name = document.getElementById('newRoomTitle').value;
    let tag = document.getElementById('newRoomTag').value;
    if (!name) return alert('Enter Title');
    socket.emit('create_room', { name, tag, host: user.username });
    hideModals();
  }

  function enterRoom(id, name) {
    currentRoomId = id;
    document.getElementById('vrTitle').innerText = name;
    document.getElementById('voiceRoom').style.display = 'flex';
    stageSeats = Array(12).fill(null);
    renderStage();
    socket.emit('join_room', { roomId: id, username: user.username });
  }

  function exitVoiceRoom() {
    document.getElementById('voiceRoom').style.display = 'none';
    currentRoomId = null;
  }

  function renderStage() {
    document.getElementById('seatsStage').innerHTML = stageSeats.map((s, i) => `
      <div class="mic-seat" onclick="handleSeatClick(${i})">
        <div class="seat-circle ${s ? (s.isMuted ? 'active muted' : 'active') : ''}">
          ${s ? (s.isMuted ? '🔇' : s.name.substring(0,2)) : (i===0?'👑':i+1)}
        </div>
        <span class="seat-name">${s ? s.name : 'Mic ' + (i+1)}</span>
      </div>
    `).join('');

    let mySeat = stageSeats.find(s => s && s.name === user?.username);
    let micBtn = document.getElementById('btnToggleMic');
    if (mySeat) {
      micBtn.style.display = 'block';
      micBtn.innerText = mySeat.isMuted ? '🔇 Muted' : '🎙️ Mic On';
    } else {
      micBtn.style.display = 'none';
    }
  }

  function handleSeatClick(i) {
    if (!stageSeats[i]) socket.emit('take_mic', { roomId: currentRoomId, seatIndex: i, username: user.username });
    else if (stageSeats[i].name === user.username) socket.emit('leave_mic', { roomId: currentRoomId, seatIndex: i, username: user.username });
  }

  function toggleSelfMic() { socket.emit('toggle_mic', { roomId: currentRoomId, username: user.username }); }

  function submitSendGift() {
    if (!activeGift) return alert('Select Gift');
    let target = document.getElementById('giftTargetSeat').value;
    socket.emit('send_gift', {
      roomId: currentRoomId,
      senderEmail: user.email,
      giftId: activeGift.id,
      target: target,
      targetName: target === 'all' ? 'All Stage Mics' : ('Mic ' + (parseInt(target)+1))
    });
    hideModals();
  }

  function sendChat() {
    let inp = document.getElementById('chatInput');
    if (inp.value.trim()) { socket.emit('send_chat', { roomId: currentRoomId, user: user.username, msg: inp.value }); inp.value = ''; }
  }

  function logout() { localStorage.removeItem('pb_live_user'); location.reload(); }

  socket.on('seats_synced', s => { stageSeats = s; renderStage(); });
  socket.on('rooms_synced', rms => renderRooms(rms));
  socket.on('room_ready', r => enterRoom(r.id, r.name));
  socket.on('gift_animation', d => {
    let b = document.getElementById('chatDisplay');
    b.innerHTML += `<div style="background:rgba(255,215,0,0.15); color:gold; padding:4px 8px; border-radius:8px; margin:3px 0;">✨ <b>${d.sender}</b> sent <b>${d.gift.name} ${d.gift.icon}</b> to ${d.target}!</div>`;
    b.scrollTop = b.scrollHeight;
  });
  socket.on('coins_updated', c => { user.coins = c; localStorage.setItem('pb_live_user', JSON.stringify(user)); syncUserDisplay(); });
  socket.on('new_chat', d => {
    let b = document.getElementById('chatDisplay');
    b.innerHTML += `<div><b style="color:#00f0ff;">${d.user}:</b> ${d.msg}</div>`;
    b.scrollTop = b.scrollHeight;
  });
</script>
</body>
        </html>
