<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PB Live World Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #070914; color: #fff; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    .mobile-frame { width: 100%; max-width: 440px; height: 100%; background: #0c1022; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    /* Auth */
    .auth-overlay { position: absolute; inset: 0; background: radial-gradient(circle at top, #1f1035, #070914); z-index: 999; display: flex; flex-direction: column; justify-content: center; padding: 24px; align-items: center; text-align: center; }
    .brand-title { font-size: 28px; font-weight: 900; background: linear-gradient(135deg, #00f0ff, #ff0055); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; text-transform: uppercase; }
    .google-btn { background: #ffffff; color: #222; font-weight: bold; border: none; padding: 14px 20px; border-radius: 30px; display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; box-shadow: 0 4px 20px rgba(255,255,255,0.25); margin-top: 14px; width: 100%; justify-content: center; }

    /* Profile Setup Modal */
    #setupScreen { display: none; z-index: 1000; }
    .setup-card { background: #121838; border: 1px solid #283670; border-radius: 20px; padding: 20px; width: 100%; display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .avatar-picker { width: 75px; height: 75px; border-radius: 50%; border: 2px dashed #00f0ff; margin: 0 auto; display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer; overflow: hidden; background: #182046; }
    .avatar-picker img { width: 100%; height: 100%; object-fit: cover; }
    .gender-box { display: flex; gap: 10px; }
    .gender-btn { flex: 1; padding: 10px; border-radius: 12px; background: #182046; border: 1px solid #283670; color: #fff; text-align: center; cursor: pointer; font-size: 13px; font-weight: bold; }
    .gender-btn.active { border-color: #00f0ff; background: #22356b; color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.4); }
    .custom-inp { background: #182046; border: 1px solid #283670; border-radius: 12px; padding: 12px; color: #fff; font-size: 13px; outline: none; width: 100%; }
    .btn-gradient { background: linear-gradient(135deg, #ff0055, #ff5e00); color: #fff; font-weight: bold; border: none; padding: 13px; border-radius: 12px; cursor: pointer; font-size: 14px; text-align: center; box-shadow: 0 4px 15px rgba(255,0,85,0.4); }

    /* Top Bar */
    .top-header { height: 54px; padding: 0 14px; display: flex; justify-content: space-between; align-items: center; background: #0e142a; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .brand-logo { font-weight: 900; font-size: 16px; color: #00f0ff; display: flex; align-items: center; gap: 6px; }
    .btn-create-room { background: linear-gradient(90deg, #00f0ff, #0072ff); color: #000; font-weight: 800; font-size: 11px; padding: 6px 12px; border-radius: 20px; border: none; cursor: pointer; }

    /* Lobby */
    .tab-content { flex: 1; overflow-y: auto; display: none; flex-direction: column; padding: 12px 12px 70px; }
    .tab-content.active { display: flex; }
    .room-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .room-card { background: #131936; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); position: relative; cursor: pointer; }
    .room-card img { width: 100%; height: 125px; object-fit: cover; }
    .room-tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); font-size: 9px; font-weight: bold; padding: 3px 8px; border-radius: 10px; color: #00f0ff; }

    /* Voice Room */
    .voice-room { position: absolute; inset: 0; background: radial-gradient(circle at top, #23123d, #070914); z-index: 300; display: none; flex-direction: column; background-size: cover; background-position: center; }
    .vr-header { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; background: rgba(14,20,42,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .stage-12 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px; }
    .mic-seat { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; }
    .seat-circle { width: 48px; height: 48px; border-radius: 50%; background: #151c3d; border: 2px dashed rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; font-size: 13px; font-weight: bold; color: #7f91c7; transition: 0.3s; position: relative; overflow: hidden; }
    .seat-circle.active { border: 2px solid #00f0ff; background: #1e2957; color: #fff; box-shadow: 0 0 12px rgba(0,240,255,0.6); }
    .seat-circle img { width: 100%; height: 100%; object-fit: cover; }
    .seat-name { font-size: 9px; color: #a1b0db; margin-top: 4px; max-width: 58px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Music Player Bar */
    .music-bar { background: rgba(19, 25, 54, 0.9); border: 1px solid #283463; border-radius: 12px; margin: 0 12px 6px; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; }

    /* Modals */
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 800; display: none; justify-content: center; align-items: flex-end; }
    .modal-sheet { width: 100%; max-width: 440px; background: #101633; border-top: 2px solid #00f0ff; border-radius: 20px 20px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-height: 80vh; overflow-y: auto; }
    .targets-bar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
    .target-pill { background: #182046; border: 1px solid #2b3874; padding: 4px 10px; border-radius: 14px; font-size: 10px; cursor: pointer; white-space: nowrap; }
    .target-pill.selected { border-color: gold; background: #3b2d18; color: gold; font-weight: bold; }
    .gift-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .gift-box { background: #161e42; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 8px; text-align: center; cursor: pointer; }
    .gift-box.active { border-color: gold; background: #2f271a; box-shadow: 0 0 10px rgba(255,215,0,0.4); }

    .bottom-nav { height: 60px; background: #0c1022; border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-around; align-items: center; position: absolute; bottom: 0; left: 0; width: 100%; z-index: 200; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #5f70a3; cursor: pointer; gap: 3px; }
    .nav-btn.active { color: #00f0ff; font-weight: bold; }
  </style>
</head>
<body>

<div class="mobile-frame">

  <!-- Step 1: Google Login -->
  <div class="auth-overlay" id="googleLoginScreen">
    <div class="brand-title">⚡ PB LIVE STUDIO</div>
    <p style="font-size: 13px; color: #8da4de; max-width: 280px;">Next-Gen 3D Voice Party & VIP Community</p>
    
    <div style="width: 100%; margin-top: 24px;">
      <input type="email" id="quickGmail" class="custom-inp" placeholder="Enter your Google Gmail" value="lp5006352@gmail.com" style="margin-bottom: 10px;">
      <button class="google-btn" type="button" onclick="startGoogleFlow()">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
    </div>
  </div>

  <!-- Step 2: Profile Setup (18+ & Gender) -->
  <div class="auth-overlay" id="setupScreen">
    <div class="setup-card">
      <h3 style="color:#00f0ff; text-align:center; font-size:16px;">✨ Complete Your PB Profile</h3>
      
      <label class="avatar-picker" for="avatarUploadInput">
        <img id="previewAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150">
      </label>
      <input type="file" id="avatarUploadInput" accept="image/*" style="display:none;" onchange="previewUserAvatar(event)">
      <p style="font-size:10px; color:#8da4de; text-align:center; margin-top:-6px;">Tap to choose photo</p>

      <div>
        <label style="font-size:11px; color:#8da4de;">Nickname:</label>
        <input type="text" id="setupUsername" class="custom-inp" value="☆ Lucky Ak47 🖥️☆">
      </div>

      <div>
        <label style="font-size:11px; color:#8da4de;">Gender:</label>
        <div class="gender-box">
          <div class="gender-btn active" id="btnMale" onclick="selectGender('Male')">♂️ Male</div>
          <div class="gender-btn" id="btnFemale" onclick="selectGender('Female')">♀️ Female</div>
        </div>
      </div>

      <div>
        <label style="font-size:11px; color:#8da4de;">Age (18+):</label>
        <input type="number" id="setupAge" class="custom-inp" value="22" min="18">
      </div>

      <button class="btn-gradient" type="button" onclick="finishProfileSetup()">Start Party Experience 🚀</button>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-header">
    <div class="brand-logo"><i class="fa-solid fa-bolt"></i> PB LIVE</div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="btn-create-room" onclick="alert('Room creation active')"><i class="fa-solid fa-plus"></i> Create</button>
      <div style="background:gold; color:#000; font-weight:bold; font-size:11px; padding:3px 8px; border-radius:12px;" id="headerCoins">0 C</div>
    </div>
  </div>

  <!-- Lobby -->
  <div class="tab-content active" id="tabLobby">
    <div class="room-grid" id="roomsDisplay"></div>
  </div>

  <!-- Profile -->
  <div class="tab-content" id="tabProfile">
    <div style="text-align:center; padding: 20px 0;">
      <div style="width:74px; height:74px; border-radius:50%; border:2px solid #00f0ff; margin:0 auto 10px; overflow:hidden;">
        <img id="myProfilePic" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <h3 id="profileName">User</h3>
      <p id="profileId" style="color:#00f0ff; font-size:12px; margin-top:2px;"></p>
      <p id="profileMeta" style="font-size:11px; color:#8da4de; margin-top:2px;">Age: 22 | Male</p>

      <div style="background:#131936; border:1px solid #232d5e; border-radius:16px; padding:16px; margin:20px 0;">
        <span style="font-size:11px; color:#8394ca;">VIP Coin Balance</span>
        <h2 style="color:gold; font-size:24px; margin-top:4px;" id="profileCoins">0 C</h2>
      </div>
      <button class="btn-gradient" style="width:100%; background:#1c244d;" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- 12-Mic Voice Room -->
  <div class="voice-room" id="voiceRoom">
    <div class="vr-header">
      <span id="vrTitle" style="color:#00f0ff; font-weight:bold; font-size:12px;">Room</span>
      <button style="background:#ff0055; border:none; color:#fff; padding:4px 10px; border-radius:10px; font-size:10px; font-weight:bold;" onclick="exitVoiceRoom()">Exit</button>
    </div>

    <div class="stage-12" id="seatsStage"></div>

    <div class="music-bar">
      <span id="musicTitle" style="max-width:140px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">🎵 No Song Playing</span>
      <label for="bgSongInput" style="background:#00f0ff; color:#000; padding:2px 8px; border-radius:8px; font-weight:bold; cursor:pointer;">📁 Add Song</label>
      <input type="file" id="bgSongInput" accept="audio/*" style="display:none;" onchange="loadLocalSong(event)">
      <audio id="roomAudio" style="display:none;"></audio>
    </div>

    <div style="flex:1; padding:8px 12px; overflow-y:auto; font-size:11px;" id="chatDisplay"></div>

    <div style="height:50px; background:#0e142a; display:flex; align-items:center; padding:0 10px; gap:8px;">
      <button style="background:linear-gradient(135deg,#ff0055,gold); border:none; border-radius:50%; width:36px; height:36px; font-size:18px; cursor:pointer;" onclick="showGiftModal()">🎁</button>
      <input type="text" id="chatInput" style="flex:1; background:#161d3b; border:1px solid #283463; border-radius:20px; padding:7px 12px; color:#fff; font-size:11px; outline:none;" placeholder="Chat live...">
      <button class="btn-create-room" onclick="sendChat()">Send</button>
    </div>
  </div>

  <!-- Gift Box -->
  <div class="modal-overlay" id="giftBoxModal">
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="color:gold; font-weight:bold; font-size:12px;">🎁 VIP Gifts</span>
        <button style="background:#283463; border:none; color:#00f0ff; font-size:10px; padding:2px 8px; border-radius:8px;" onclick="selectAllTargets()">Select All</button>
      </div>
      <div class="targets-bar" id="targetPillsDisplay"></div>
      <div class="gift-grid" id="giftItemsDisplay"></div>
      <button class="btn-gradient" onclick="submitMultiGift()">Send Gift 🚀</button>
      <button style="background:transparent; border:none; color:#888; font-size:12px; padding:4px;" onclick="hideModals()">Close</button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-btn active" onclick="switchTab('tabLobby', this)"><i class="fa-solid fa-house" style="font-size:16px;"></i><span>Party</span></div>
    <div class="nav-btn" onclick="switchTab('tabProfile', this)"><i class="fa-solid fa-user" style="font-size:16px;"></i><span>Profile</span></div>
  </div>

</div>

<script>
  let user = null, curRoom = null, stageSeats = Array(12).fill(null);
  let giftList = [
    { id: 'g1', name: 'Rose', price: 10, icon: '🌹' },
    { id: 'g2', name: 'Diamond Mic', price: 500, icon: '🎙️' },
    { id: 'g3', name: 'PB Supercar', price: 1999, icon: '🏎️' },
    { id: 'g4', name: 'Royal Crown', price: 5000, icon: '👑' },
    { id: 'g5', name: 'Dragon King', price: 99999, icon: '🐉' }
  ];
  let defaultRooms = [
    {
      id: 'pb_rap_101',
      name: '🔥 Official Tech Love Rap Cypher',
      tag: 'Rap Battle',
      host: '☆ Lucky Ak47 🖥️☆',
      cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500',
      seats: Array(12).fill(null)
    },
    {
      id: 'pb_vip_202',
      name: '👑 PB Cyber VIP Lounge',
      tag: 'VIP Club',
      host: 'PB Tech Boss',
      cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500',
      seats: Array(12).fill(null)
    }
  ];

  let activeGift = null, selectedTargets = [], tempAvatar = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', selectedGender = 'Male';

  renderRooms(defaultRooms);
  renderGiftList();

  function startGoogleFlow() {
    document.getElementById('googleLoginScreen').style.display = 'none';
    document.getElementById('setupScreen').style.display = 'flex';
  }

  function selectGender(g) {
    selectedGender = g;
    document.getElementById('btnMale').classList.toggle('active', g === 'Male');
    document.getElementById('btnFemale').classList.toggle('active', g === 'Female');
  }

  function previewUserAvatar(e) {
    let reader = new FileReader();
    reader.onload = () => {
      tempAvatar = reader.result;
      document.getElementById('previewAvatar').src = tempAvatar;
    };
    if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
  }

  function finishProfileSetup() {
    let age = parseInt(document.getElementById('setupAge').value);
    let username = document.getElementById('setupUsername').value.trim();

    if (!username) return alert('Enter Nickname');
    if (!age || age < 18) return alert('Must be 18+');

    user = {
      pbId: '2081902760',
      email: 'lp5006352@gmail.com',
      username: username,
      avatar: tempAvatar,
      gender: selectedGender,
      age: age,
      coins: 1000000000
    };

    document.getElementById('setupScreen').style.display = 'none';
    syncUserDisplay();
  }

  function syncUserDisplay() {
    if (!user) return;
    document.getElementById('headerCoins').innerText = (user.coins || 0).toLocaleString() + ' C';
    document.getElementById('profileCoins').innerText = (user.coins || 0).toLocaleString() + ' C';
    document.getElementById('profileName').innerText = user.username;
    document.getElementById('profileId').innerText = 'PB ID: ' + user.pbId;
    document.getElementById('profileMeta').innerText = `Age: ${user.age} | ${user.gender}`;
    document.getElementById('myProfilePic').src = user.avatar;
  }

  function renderRooms(rms) {
    if (!rms) return;
    document.getElementById('roomsDisplay').innerHTML = rms.map(r => `
      <div class="room-card" onclick="enterRoom('${r.id}', '${r.name}')">
        <span class="room-tag">${r.tag}</span>
        <img src="${r.cover}">
        <div style="padding:8px 10px;">
          <div style="font-size:12px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${r.name}</div>
          <div style="font-size:10px; color:#7f91c7; margin-top:2px;">👑 ${r.host}</div>
        </div>
      </div>
    `).join('');
  }

  function renderGiftList() {
    if (!giftList) return;
    document.getElementById('giftItemsDisplay').innerHTML = giftList.map(g => `
      <div class="gift-box" id="gb_${g.id}" onclick="selectGift('${g.id}')">
        <div style="font-size:22px;">${g.icon}</div>
        <div style="font-size:10px; font-weight:bold; margin-top:2px;">${g.name}</div>
        <div style="font-size:9px; color:gold;">${g.price.toLocaleString()} C</div>
      </div>
    `).join('');
  }

  function selectGift(id) {
    activeGift = giftList.find(x => x.id === id);
    document.querySelectorAll('.gift-box').forEach(b => b.classList.remove('active'));
    let el = document.getElementById('gb_' + id);
    if (el) el.classList.add('active');
  }

  function switchTab(tId, el) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
    document.getElementById(tId).classList.add('active');
  }

  function enterRoom(id, name) {
    document.getElementById('vrTitle').innerText = name;
    document.getElementById('voiceRoom').style.display = 'flex';
    stageSeats = Array(12).fill(null);
    renderStage();
  }

  function exitVoiceRoom() {
    document.getElementById('voiceRoom').style.display = 'none';
    let audio = document.getElementById('roomAudio');
    if (audio) audio.pause();
  }

  function renderStage() {
    document.getElementById('seatsStage').innerHTML = stageSeats.map((s, i) => `
      <div class="mic-seat" onclick="handleSeatClick(${i})">
        <div class="seat-circle ${s ? 'active' : ''}">
          ${s ? `<img src="${s.avatar}">` : (i===0?'👑':i+1)}
        </div>
        <
